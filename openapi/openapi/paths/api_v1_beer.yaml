get:
  tags:
    - Beer
  summary: List all beers
  description: Returns a list of all beers in the system.
  operationId: listBeers
  responses:
    '200':
      description: Successful operation
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: '../components/schemas/Beer.yaml'
    '401':
      description: Unauthorized
      $ref: ../components/responses/Problem.yaml
  security:
    - api_key: []
post:
  tags:
    - Beer
  summary: Create a new beer
  description: Creates a new beer in the system.
  operationId: handlePost
  requestBody:
    description: Beer object to be added
    required: true
    content:
      application/json:
        schema:
          $ref: '../components/schemas/Beer.yaml'
  responses:
    '201':
      description: Beer created
      content:
        application/json:
          schema:
            $ref: '../components/schemas/Beer.yaml'
    '400':
      description: Invalid request
      $ref: ../components/responses/Problem.yaml
    '401':
      description: Unauthorized
      $ref: ../components/responses/Problem.yaml
  security:
    - api_key: []
